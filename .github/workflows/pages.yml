# GitHub Pages 배포 (선택)
#
# 이 게임은 빌드 과정이 없는 순수 정적 사이트다. 그래서 보통은 이 워크플로가
# 필요 없다 — 저장소 설정에서 "Deploy from a branch" 를 고르면 GitHub 이 알아서
# 브랜치를 그대로 서빙한다 (README 참고).
#
# 이 워크플로는 Pages 소스를 "GitHub Actions" 로 쓰고 싶을 때만 쓴다.
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# 그렇게 바꾼 뒤 Actions 탭에서 이 워크플로를 Run workflow 로 한 번 돌리면 된다.
#
# 자동 푸시 트리거를 걸지 않은 이유: Pages 소스가 "GitHub Actions" 가 아니면
# 배포 단계가 매번 실패해서 푸시마다 실패 알림이 쌓인다.
# Actions 소스로 쓰기로 정했다면 아래 on: 에 push 트리거를 추가하면 된다.
#
#   on:
#     push:
#       branches: [claude/mario-kart-game-gdaa1e]
#     workflow_dispatch:

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        # enablement 는 쓰지 않는다. GITHUB_TOKEN 으로는 Pages 사이트를 새로
        # 만들 수 없어서(Resource not accessible by integration) 반드시 실패한다.
        # Pages 는 저장소 설정에서 사람이 한 번 켜야 한다.
        uses: actions/configure-pages@v5

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
