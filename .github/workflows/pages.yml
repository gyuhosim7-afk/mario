# 링크만 열면 바로 플레이되도록 GitHub Pages 로 배포한다.
# 빌드 과정이 없는 순수 정적 사이트라 저장소를 그대로 올린다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/mario-kart-game-gdaa1e
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정 (꺼져 있으면 켠다)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
