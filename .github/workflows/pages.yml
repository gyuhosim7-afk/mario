# GitHub Pages 배포
#
# 저장소 설정의 Pages 소스가 "GitHub Actions" 일 때 동작한다.
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# 빌드 과정이 없는 순수 정적 사이트라 저장소를 그대로 아티팩트로 올린다.
# 기본 브랜치에 푸시할 때마다 자동으로 다시 배포된다.
#
# 주의: configure-pages 의 enablement 옵션은 쓰지 않는다. GITHUB_TOKEN 으로는
# Pages 사이트를 처음 만들 수 없어서(Resource not accessible by integration)
# 반드시 실패한다. Pages 는 위 설정 화면에서 사람이 한 번 켜야 한다.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/mario-kart-game-gdaa1e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        # enablement 는 쓰지 않는다. GITHUB_TOKEN 으로는 Pages 사이트를 새로
        # 만들 수 없어서(Resource not accessible by integration) 반드시 실패한다.
        # Pages 는 저장소 설정에서 사람이 한 번 켜야 한다.
        uses: actions/configure-pages@v5

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
